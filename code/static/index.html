<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Voice Chat</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,500,700&display=swap">
  <style>
    :root {
      /* Colors for a serious and neat look */
      --primary: #2c3e50;               /* Deep slate */
      --secondary: #e0e0e0;             /* Light gray */
      --bubble-user: #2c3e50;           /* User message bubble */
      --bubble-user-text: #ffffff;      /* White text for user bubble */
      --bubble-assistant: #dcdcdc;      /* Assistant message bubble */
      --bubble-assistant-text: #333333; /* Dark gray text for assistant bubble */
      --bg: #f4f4f4;                    /* Very light gray page background */
      --shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: url("static/background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .chat-container {
      flex: 1;
      max-width: 480px;
      width: 100%;
      background: #fff;
      box-shadow: var(--shadow);
      margin: 24px 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: var(--primary);
      color: #fff;
      padding: 18px 24px;
      font-size: 1.25rem;
      letter-spacing: 1px;
      font-weight: 500;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      font-size: 0.9rem;
      color: #c0c0c0;
      margin-left: auto;
    }
    .messages {
      flex: 1;
      padding: 20px 16px 16px 16px;
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 82%;
      font-size: 1.02rem;
      line-height: 1.6;
      position: relative;
      display: inline-block;
      word-break: break-word;
      box-shadow: 0 0.5px 2px rgba(44,62,80,0.1);
    }
    .bubble.user {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    .bubble.assistant {
      background: var(--bubble-assistant);
      color: var(--bubble-assistant-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      margin-right: auto;
    }
    /* Updated typing bubble to a simpler, lighter color */
    .bubble.typing {
      background: #ebedef;
      color: #444;
      font-style: italic;
      opacity: 0.9;
      animation: pulsebg 1.3s linear infinite;
      min-width: 60px;
      border-radius: 16px;
    }
    @keyframes pulsebg {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    .input-bar {
      display: flex;
      padding: 12px 12px;
      background: #fff;
      border-top: 1px solid #e1e5ef;
      align-items: center;
      gap: 8px;
    }
    .input-bar button {
      appearance: none;
      outline: none;
      border: none;
      padding: 8px 18px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      margin-left: 4px;
    }
    .input-bar button:active {
      background: #203a4a;
    }
    .input-bar button:disabled {
      background: #a0a0a0;
      cursor: default;
    }
    .settings-btn {
      background: #2f526d;
      padding: 8px 12px;
      min-width: 94px;
      font-size: 0.85rem;
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 18, 24, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .settings-overlay[hidden] {
      display: none;
    }
    .settings-dialog {
      width: min(700px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.22);
      padding: 20px 20px 12px;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: 1.4rem;
    }
    .settings-close {
      border: none;
      background: transparent;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      color: #4a4a4a;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .settings-section {
      padding: 16px;
      border: 1px solid #ebedf0;
      border-radius: 12px;
      background: #fafafa;
    }
    .settings-field {
      margin-bottom: 14px;
    }
    .settings-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2e3a46;
    }
    .settings-field input,
    .settings-field select,
    .settings-field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d9dee6;
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      background: white;
    }
    .settings-field textarea {
      min-height: 110px;
      resize: vertical;
    }
    .settings-help {
      margin: 6px 0 0;
      color: #5d6773;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .settings-help.error { color: #b63e3e; }
    .settings-help.success { color: #1e7f52; }
    .provider-actions > div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .provider-actions button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      background: #eef1f4;
      color: #26323d;
      font: inherit;
      cursor: pointer;
    }
    .provider-actions button:disabled { opacity: 0.6; cursor: wait; }
    .provider-actions [hidden] { display: none; }
    .provider-advanced summary {
      cursor: pointer;
      font-weight: 600;
      color: #2e3a46;
    }
    .provider-advanced[open] summary { margin-bottom: 12px; }
    .detected-providers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
      padding-top: 6px;
    }
    .settings-actions button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .settings-actions .secondary {
      background: #eef1f4;
      color: #26323d;
    }
    .settings-actions .primary {
      background: var(--primary);
      color: white;
    }
    .settings-feedback {
      min-height: 1.2em;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #3d5d79;
    }
    .settings-feedback.error { color: #b63e3e; }
    .settings-feedback.success { color: #1e7f52; }
    .settings-feedback.notice { color: #824d19; }
    @media (max-width: 600px) {
      .chat-container {
        margin: 0;
        border-radius: 0;
        max-width: 100vw;
      }
      .header {
        border-radius: 0;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 16px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
    }

    .btn svg {
      margin: 0;
    }

    .start-btn {
      background-color: #2a3543;
    }

    .stop-btn {
      background-color: #c04949;
    }

    .reset-btn {
      background-color: #0d65d0;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }    
    .speed-control {
      flex: 1;
      margin: 0 16px;
      max-width: 200px;
    }
    #speedSlider {
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    #speedSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #2c3e50;
      border-radius: 50%;
      cursor: pointer;
    }
    .speed-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-container">
      <div class="header">
        <!-- Centered “AI” text within the circle -->
        <svg height="24" width="24" viewBox="0 0 22 22" fill="#fff" style="margin-right:8px">
          <circle cx="11" cy="11" r="12" fill="#222F3D" />
          <text
            x="50%"
            y="50%"
            fill="#fff"
            text-anchor="middle"
            alignment-baseline="middle"
            font-size="12"
            font-family="Inter"
          >AI</text>
        </svg>
        Real-Time Voice Chat
        <span class="status" id="status"></span>
        <button id="settingsBtn" class="btn settings-btn" type="button">Settings</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">

        <div class="speed-control">
          <input type="range" id="speedSlider" min="0" max="100" value="0">
          <div class="speed-labels">
            <span>Fast</span>
            <span>Slow</span>
          </div>
        </div>

        <br>

        <button id="startBtn" title="Start voice chat" class="btn start-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 5L18 12L8 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        
        <button id="stopBtn" title="Stop voice chat" class="btn stop-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        
        <button id="clearBtn" title="Reset conversation" class="btn reset-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.8273 3 17.35 4.30367 19 6.34267" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14.5 6.5L19.5 6.5L19.5 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button> 

        <button id="copyBtn" title="Copy conversation" class="btn copy-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
           <rect x="9" y="9" width="11" height="11" rx="1" stroke="currentColor" stroke-width="2"/>
           <path d="M5 15H4C3.44772 15 3 14.5523 3 14V4C3 3.44772 3.44772 3 4 3H14C14.5523 3 15 3.44772 15 4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
         </svg>
       </button>

      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
         <h2 id="settingsTitle">Application settings</h2>
         <button id="closeSettingsBtn" class="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>
      <div id="settingsFeedback" class="settings-feedback" role="status" aria-live="polite"></div>
      <form id="settingsForm">
         <div class="settings-grid">
           <section class="settings-section">
             <h3>AI model</h3>
             <div class="settings-field">
               <label for="llmProvider">Provider</label>
               <select id="llmProvider" name="llm_provider">
                 <option value="ollama">Ollama (recommended for local use)</option>
                 <option value="openai">OpenAI / Azure API</option>
                 <option value="lmstudio">LM Studio (local)</option>
                 <option value="openai_compatible">Custom local server (OpenAI-compatible)</option>
               </select>
               <p id="llmProviderHelp" class="settings-help">Choose the model service you want to use.</p>
             </div>
             <div class="settings-field">
               <label for="llmModel">Model name</label>
               <input id="llmModel" name="llm_model" type="text" autocomplete="off" required>
             </div>
             <details id="providerAdvancedSettings" class="provider-advanced">
               <summary>Advanced connection options</summary>
               <div class="settings-field">
                 <label for="llmBaseUrl">Custom provider address</label>
                 <input id="llmBaseUrl" name="llm_base_url" type="text" autocomplete="off" placeholder="Leave blank for automatic local detection">
                 <p id="llmBaseUrlHelp" class="settings-help">Normally leave this blank. Use it only for a custom provider address.</p>
               </div>
             </details>
             <div class="settings-field provider-actions">
               <div>
                 <button class="secondary" id="detectProvidersBtn" type="button">Find models on this computer</button>
                 <button class="secondary" id="testProviderBtn" type="button">Test connection</button>
               </div>
               <p id="providerStatus" class="settings-help" role="status" aria-live="polite"></p>
               <div id="detectedProviders" class="detected-providers"></div>
               <label id="availableModelsLabel" for="availableModelsSelect" class="settings-help" hidden>Available models</label>
               <select id="availableModelsSelect" aria-describedby="availableModelsLabel" hidden></select>
             </div>
           </section>

           <section class="settings-section">
             <h3>Voice and speech</h3>
             <div class="settings-field">
               <label for="ttsEngine">Speech engine</label>
               <select id="ttsEngine" name="tts_engine">
                 <option value="coqui">Coqui</option>
                 <option value="kokoro">Kokoro</option>
                 <option value="orpheus">Orpheus</option>
               </select>
             </div>
             <div class="settings-field">
               <label for="ttsModel">Speech model</label>
               <input id="ttsModel" name="tts_model" type="text" autocomplete="off" required>
             </div>
             <div class="settings-field">
               <label for="ttsVoice">Voice</label>
               <input id="ttsVoice" name="tts_voice" type="text" autocomplete="off" required>
             </div>
             <div class="settings-field">
               <label for="ttsSpeed">Speech speed</label>
               <input id="ttsSpeed" name="tts_speed" type="range" min="0.5" max="2" step="0.05">
             </div>
           </section>

           <section class="settings-section">
             <h3>Listening</h3>
             <div class="settings-field">
               <label for="sttLanguage">Language code</label>
               <input id="sttLanguage" name="stt_language" type="text" autocomplete="off" required>
             </div>
             <div class="settings-field">
               <label for="sttModel">Transcription model</label>
               <input id="sttModel" name="stt_model" type="text" autocomplete="off" required>
             </div>
             <div class="settings-field">
               <label for="turnSpeed">Reply timing</label>
               <input id="turnSpeed" name="turn_speed" type="range" min="0" max="100" step="1">
             </div>
           </section>

           <section class="settings-section">
             <h3>Assistant behavior</h3>
             <div class="settings-field">
               <label for="systemPrompt">System prompt</label>
               <textarea id="systemPrompt" name="system_prompt"></textarea>
             </div>
           </section>
         </div>

         <div class="settings-actions">
           <button class="secondary" id="cancelSettingsBtn" type="button">Close</button>
           <button class="primary" id="saveSettingsBtn" type="submit">Save settings</button>
         </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
